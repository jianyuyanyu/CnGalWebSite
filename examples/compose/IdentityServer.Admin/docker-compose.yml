# Requires Docker Compose 5.4.0+ for pre_start hook image resolution.
services:
  identityserveradmin:
    image: ghcr.io/cngal/cngalwebsiteidentityserveradmin:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-identityserveradmin}
    hostname: identityserveradmin

    restart: unless-stopped

    pre_start:
      - image: busybox
        command: ["chown", "-R", "1654:1654", "/home/app/.aspnet/DataProtection-Keys"]
        user: root

    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-5100}:8080"

    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      Authority: ${Authority:-https://oauth2.cngal.org}
      ClientId: ${ClientId}
      ClientSecret: ${ClientSecret}
      IdsApiUrl: ${IdsApiUrl:-https://oauth2.cngal.org}
      TokenAPI: ${TokenAPI:-https://oauth2.cngal.org/api/tokens/}
      TokenAPISecret: ${TokenAPISecret}

    labels:
      com.centurylinklabs.watchtower.enable: ${WATCHTOWER_ENABLE:-true}

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/healthz"]

    volumes:
      - ${DATA_PROTECTION_KEYS_DIR:-DataProtection-Keys}:/home/app/.aspnet/DataProtection-Keys

    deploy:
      resources:
        limits:
          memory: ${RESOURCES_LIMITS_MEMORY:-500m}

volumes:
  DataProtection-Keys:
